<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#385f4b"><title>Family Table</title><meta name="description" content="The Cameron family's shared recipes, weekly planning and grocery lists."><link rel="stylesheet" href="/styles.css"></head><body>
<div id="auth" class="authwrap"></div>
<div id="app" class="hidden"><div class="shell"><div class="topbar"><div class="brand"><div class="brandmark">🍽</div>Family Table</div><div><span id="who" class="meta"></span> <button class="ghost" id="logout">Sign out</button></div></div><main>
<section id="recipes" class="view"><div class="hero"><div><h1>Family recipes.</h1><p>Save favorites, import a link, or add one by hand.</p></div><div class="actions"><button class="secondary" id="importRecipe">Import URL</button><button class="primary" id="addRecipe">+ Add recipe</button></div></div><input id="search" class="search" placeholder="Search recipes or ingredients…"><div id="recipeGrid" class="grid"></div></section>
<section id="plan" class="view hidden"><div class="hero"><div><h1>Plan the week.</h1><p>Pick recipes and adjust servings for each meal.</p></div></div><div id="planList"></div><div id="planBar" class="planbar hidden"><span id="selectedCount"></span><button id="createTrip">Create shopping list</button></div></section>
<section id="shopping" class="view hidden"><div id="shoppingContent"></div></section>
<section id="history" class="view hidden"><div class="hero"><div><h1>Shopping history.</h1><p>Every grocery trip stays saved as a snapshot.</p></div></div><div id="historyList"></div></section>
</main></div><nav class="nav"><div class="navin"><button class="tab active" data-tab="recipes"><span>📖</span>Recipes</button><button class="tab" data-tab="plan"><span>🗓</span>Plan</button><button class="tab" data-tab="shopping"><span>🛒</span>Shopping</button><button class="tab" data-tab="history"><span>🕘</span>History</button></div></nav></div>
<div id="modalBack" class="modalback hidden"><div class="modal" id="modal"></div></div><div id="toast" class="toast hidden"></div>
<script src="/vendor/supabase.js"></script><script src="/app.js"></script></body></html>
